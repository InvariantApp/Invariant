name: Invariant release check
description: >-
  Checks that this pull request's declared Changes explain what the API
  actually did, and posts the result as a comment.
author: Invariant

branding:
  icon: shield
  color: blue

inputs:
  config:
    description: Path to invariant.yaml, relative to the repository root.
    required: false
    default: invariant.yaml
  full:
    description: >-
      Start the provider's own builds and compare what they do. This is what
      catches a value map whose pairs are swapped and a specification that has
      drifted from the code; nothing else can. Needs a build section in
      invariant.yaml, and the provider's dependencies installed in an earlier
      step.
    required: false
    default: "false"
  comment:
    description: >-
      Post the report on the pull request, editing the previous one rather than
      adding another on every push.
    required: false
    default: "true"
  token:
    description: >-
      Used only to write the pull request comment. A pull request from a fork
      gets a read-only token, and the check still gives its verdict without it.
    required: false
    default: ${{ github.token }}

outputs:
  result:
    description: pass, warn or block.
  unexplained:
    description: How many breaking changes no declared Change accounts for.
  report:
    description: Path to the report, as Markdown.

# One bundled file from this repository, at the ref the workflow names. It
# needs neither npm nor Go: oasdiff is downloaded from its pinned release,
# verified against two hashes, and cached on the runner.
runs:
  using: node24
  main: packages/action/bundle/main.js
