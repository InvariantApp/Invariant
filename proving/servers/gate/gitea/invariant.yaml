# Gitea 1.24 -> 1.25, configured the way a stranger to Invariant would from
# the docs alone. Gitea serves its own Swagger 2.0 document. Nothing here
# makes a user, so what is compared is what Gitea answers anyone who asks.
api: gitea
spec:
  current: specs/v1.25.4.json
  currentLabel: v1.25.4
  released:
    v1.24.2: specs/v1.24.2.json

identity:
  - kind: default
    label: v1.24.2

build:
  head:
    image: gitea/gitea:1.25.4@sha256:17d18218be2dad1f8ed402a4f906989505c90ab8b66ee9befcecfb5d470133e7
    port: 3000
    env: &gitea
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://gitea:3000/
    proxy: true
  contracts:
    v1.24.2:
      image: gitea/gitea:1.24.2@sha256:8e2e3f40c5ff3fee920c6d0faac0db9cca2183d80ff23965d1022434d37e7910
      port: 3000
      env: *gitea
  healthPath: /api/v1/version
  readyTimeout: 300
  startPer: contract
