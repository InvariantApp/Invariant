# Drafted by rules, 50% confident.
#
# This is a proposal, not a decision. Read it, fix what is wrong, and merge
# it; merging is what records that you confirmed it. The release gate will
# still check that these ops explain the whole breaking diff.
#
# NEEDS A CLOSE LOOK:
#   - the field kept its name, so only its values moved
#   - `Read/Write` became `Read/write`
#   - a value that went is paired with the one that arrived only because each was the only one; confirm it is the same thing renamed, and not one retired and an unrelated one added
irVersion: 1
id: chg_custom_field_ui_visibility_label
summary: "`ui_visibility.label` changed shape on CustomField."
scopes:
  - schema: "#/components/schemas/CustomField"
ops:
  - op: convert
    path: /ui_visibility/label
    codec:
      kind: enumMap
      pairs:
        - - Read-only
          - Read-only
        - - Hidden
          - Hidden
        - - Hidden (if unset)
          - Hidden (if unset)
        - - Read/Write
          - Read/write
provenance:
  proposed_by:
    judge: rules
    confidence: 0.5
