# Drafted by rules, 100% confident.
#
# This is a proposal, not a decision. Read it, fix what is wrong, and merge
# it; merging is what records that you confirmed it. The release gate will
# still check that these ops explain the whole breaking diff.
#
#   - the field kept its name, so only its values moved
#   - `state` now names the values it holds (`pending`, `success`, `error`, `failure`, `warning`, `skipped`), each of them text the old contract already allowed; nothing an old caller is sent changes
irVersion: 1
id: chg_combined_status_state
summary: "`state` changed shape on CombinedStatus."
scopes:
  - schema: "#/components/schemas/CombinedStatus"
ops:
  - op: relax
    path: /state
    set:
      enum:
        - pending
        - success
        - error
        - failure
        - warning
        - skipped
provenance:
  proposed_by:
    judge: rules
    confidence: 1
