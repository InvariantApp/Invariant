irVersion: 1
id: chg_operation_repo_update_branch_to_repo_rename_branch
summary: The operation repoUpdateBranch is now called repoRenameBranch.
ops:
  - op: route
    from: &a1
      method: patch
      path: /repos/{owner}/{repo}/branches/{branch}
    to: *a1
    operationId:
      from: repoUpdateBranch
      to: repoRenameBranch
provenance:
  proposed_by:
    judge: rules
    confidence: 1
