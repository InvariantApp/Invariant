# Written by hand, as Gitea's maintainers would (go-gitea/gitea#34517, listed
# under BREAKING in 1.25.0): creating an Actions variable answers 201 Created
# where 1.24 answered 204 No Content, both with an empty body. The catalogue
# has no op that answers an old caller with another success status, so this is
# acknowledged, not served, and go-sdk 0.22.1's variable tests still fail
# through the proxy.
irVersion: 1
id: chg_variable_created_status
summary: "Creating an Actions variable answers 201 Created where it answered 204."
scopes: []
ops:
  - op: behavior
    flag: variable_created_status
    covers:
      - "response-success-status-removed at POST /orgs/{org}/actions/variables/{variablename}: removed the success response with the status `204`"
      - "response-success-status-removed at POST /repos/{owner}/{repo}/actions/variables/{variablename}: removed the success response with the status `204`"
      - "response-success-status-removed at POST /user/actions/variables/{variablename}: removed the success response with the status `204`"
assertions:
  side_effects_unchanged: true
