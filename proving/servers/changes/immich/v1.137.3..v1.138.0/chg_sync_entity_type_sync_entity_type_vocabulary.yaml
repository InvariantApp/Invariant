# Written by hand, as Immich's maintainers would: 1.138 syncs an album's
# assets, and their metadata, as two kinds, created and updated, where 1.137
# synced both as one. An old caller acking the one kind acks the created ones,
# and is shown an update as the one kind it knows, which is what it was shown
# before.
