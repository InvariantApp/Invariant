# Reviewed and kept: 0.23 renamed labels to tags throughout, and the items
# list filters by tag ids under `tags` where it filtered by label ids under
# `labels`.
# Drafted by rules, 100% confident.
#
# This is a proposal, not a decision. Read it, fix what is wrong, and merge
# it; merging is what records that you confirmed it. The release gate will
# still check that these ops explain the whole breaking diff.
#
# NEEDS A CLOSE LOOK:
#   - the only query parameter that went and the only one that arrived have the same shape; confirm it is the same parameter renamed and not one dropped and another added
irVersion: 1
id: chg_param_get_v1_items_labels
summary: The `labels` query parameter of get_v1_items is called `tags`.
scopes:
  - operation: get_v1_items
    location: query
ops:
  - op: move
    from: /labels
    to: /tags
provenance:
  proposed_by:
    judge: rules
    confidence: 1
assertions:
  same_concept: true
  side_effects_unchanged: true
