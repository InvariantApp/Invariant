# Written by hand, as Homebox's maintainers would (sysadminsmedia/homebox
# 0.23.0, labels renamed to tags throughout): `defaultLabelIds` is `defaultTagIds`, a template's default labels, sent by id,
# the same values under the new name, which the proposer, run without a
# judge, could not tell from a field dropped and another added.
irVersion: 1
id: chg_item_template_create_default_label_ids_renamed
summary: "`defaultLabelIds` is `defaultTagIds` on repo.ItemTemplateCreate."
scopes:
  - schema: "#/components/schemas/repo.ItemTemplateCreate"
ops:
  - op: move
    from: /defaultLabelIds
    to: /defaultTagIds
assertions:
  same_concept: true
  side_effects_unchanged: true
