# Written by hand, as Qdrant's maintainers would: 1.18 adds TurboQuantization
# to the quantization a collection reports. An old caller only meets it on a
# collection a newer caller configured that way, and the vectors configuration
# that holds it is a choice between one set of parameters and a map of them,
# which nothing tells apart, so no widen can be placed there. Acknowledged,
# not served.
irVersion: 1
id: chg_turbo_quantization
summary: "A collection can be quantized with TurboQuantization, a kind old callers never saw."
scopes: []
ops:
  - op: behavior
    flag: turbo_quantization
    covers:
      - "response-property-any-of-added at GET /collections/{collection_name}: added `#/components/schemas/TurboQuantization` to the `result/config/params/vectors/anyOf[#/components/schemas/VectorParams]/quantization_config/anyOf[#/components/schemas/QuantizationConfig]/` response property `anyOf` list for the response status `200`"
      - "response-property-any-of-added at GET /collections/{collection_name}: added `#/components/schemas/TurboQuantization` to the `result/config/params/vectors/anyOf[subschema #2]/additionalProperties/quantization_config/anyOf[#/components/schemas/QuantizationConfig]/` response property `anyOf` list for the response status `200`"
      - "response-property-any-of-added at GET /collections/{collection_name}: added `#/components/schemas/TurboQuantization` to the `result/config/quantization_config/anyOf[#/components/schemas/QuantizationConfig]/` response property `anyOf` list for the response status `200`"
      - "response-property-any-of-added at GET /telemetry: added `#/components/schemas/TurboQuantization` to the `result/collections/collections/items/anyOf[#/components/schemas/CollectionTelemetry]/config/anyOf[#/components/schemas/CollectionConfigTelemetry]/params/vectors/anyOf[#/components/schemas/VectorParams]/quantization_config/anyOf[#/components/schemas/QuantizationConfig]/` response property `anyOf` list for the response status `200`"
      - "response-property-any-of-added at GET /telemetry: added `#/components/schemas/TurboQuantization` to the `result/collections/collections/items/anyOf[#/components/schemas/CollectionTelemetry]/config/anyOf[#/components/schemas/CollectionConfigTelemetry]/params/vectors/anyOf[subschema #2]/additionalProperties/quantization_config/anyOf[#/components/schemas/QuantizationConfig]/` response property `anyOf` list for the response status `200`"
      - "response-property-any-of-added at GET /telemetry: added `#/components/schemas/TurboQuantization` to the `result/collections/collections/items/anyOf[#/components/schemas/CollectionTelemetry]/config/anyOf[#/components/schemas/CollectionConfigTelemetry]/quantization_config/anyOf[#/components/schemas/QuantizationConfig]/` response property `anyOf` list for the response status `200`"
      - "response-property-any-of-added at GET /telemetry: added `#/components/schemas/TurboQuantization` to the `result/collections/collections/items/anyOf[#/components/schemas/CollectionTelemetry]/shards/items/local/anyOf[#/components/schemas/LocalShardTelemetry]/segments/items/config/vector_data/additionalProperties/quantization_config/anyOf[#/components/schemas/QuantizationConfig]/` response property `anyOf` list for the response status `200`"
      - "response-property-any-of-added at GET /telemetry: added `#/components/schemas/TurboQuantization` to the `result/collections/collections/items/anyOf[#/components/schemas/CollectionsAggregatedTelemetry]/params/vectors/anyOf[#/components/schemas/VectorParams]/quantization_config/anyOf[#/components/schemas/QuantizationConfig]/` response property `anyOf` list for the response status `200`"
      - "response-property-any-of-added at GET /telemetry: added `#/components/schemas/TurboQuantization` to the `result/collections/collections/items/anyOf[#/components/schemas/CollectionsAggregatedTelemetry]/params/vectors/anyOf[subschema #2]/additionalProperties/quantization_config/anyOf[#/components/schemas/QuantizationConfig]/` response property `anyOf` list for the response status `200`"
assertions:
  side_effects_unchanged: true
