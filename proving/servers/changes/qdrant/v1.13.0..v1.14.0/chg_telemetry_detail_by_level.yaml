# Written by hand, as Qdrant's maintainers would: 1.14 reports a collection's
# shards, transfers, resharding and clean tasks, a shard's segments and
# optimizer log, and each duration total, only at the details level that asks
# for them, where 1.13 promised them in every telemetry answer; it also writes
# a collection's strict mode config in telemetry as StrictModeConfigOutput.
# What is left out was not measured, so any value filled in for it would be
# made up. Nothing is transformed, and an old caller that reads them has to be
# served by provider code.
irVersion: 1
id: chg_telemetry_detail_by_level
summary: Telemetry reports its detail only at the level asked for.
scopes: []
ops:
  - op: behavior
    flag: telemetry_detail_by_level
    covers:
      - "response-property-any-of-added at GET /telemetry: added `#/components/schemas/StrictModeConfigOutput` to the `result/collections/collections/items/anyOf[#/components/schemas/CollectionTelemetry]/config/strict_mode_config` response property `anyOf` list for the response status `200`"
      - "response-property-became-nullable at GET /telemetry: the response property `result/collections/collections/items/anyOf[#/components/schemas/CollectionTelemetry]/resharding` became nullable for the status `200`"
      - "response-property-became-nullable at GET /telemetry: the response property `result/collections/collections/items/anyOf[#/components/schemas/CollectionTelemetry]/shard_clean_tasks` became nullable for the status `200`"
