# Written by hand, as Qdrant's maintainers would: 1.14 counts a request's
# I/O by what it touched, payload, payload index or vectors, and no longer
# reports the two totals, io_read and io_write, that 1.13 promised in every
# response's usage and in hardware telemetry. No op can add the new counts
# back up into the old totals, so nothing is transformed: an old caller that
# reads them has to be served by provider code. Usage is reported only when
# hardware reporting is switched on.
irVersion: 1
id: chg_hardware_usage_io_totals_removed
summary: "`io_read` and `io_write` are no longer reported; I/O is counted by kind instead."
scopes: []
ops:
  - op: behavior
    flag: hardware_io_by_kind
    covers:
      - "response-required-property-removed at GET /aliases: removed the required property `usage/anyOf[#/components/schemas/HardwareUsage]/io_read` from the response with the `200` status"
