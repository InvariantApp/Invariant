# Reviewed and kept: a null is sent to old callers as the field left out, which
# they could always be sent, and is the loss acknowledged below.
# Drafted by rules, 100% confident.
#
# This is a proposal, not a decision. Read it, fix what is wrong, and merge
# it; merging is what records that you confirmed it. The release gate will
# still check that these ops explain the whole breaking diff.
#
#   - the field kept its name and its values
#   - `fail_count` can now be null, and old callers, who could always be sent it left out, are sent it that way
irVersion: 1
id: chg_operation_duration_statistics_fail_count
summary: "`fail_count` changed shape on OperationDurationStatistics."
scopes:
  - schema: "#/components/schemas/OperationDurationStatistics"
ops:
  - op: dropNull
    path: /fail_count
    toward: old
provenance:
  proposed_by:
    judge: rules
    confidence: 1
assertions:
  loss_acknowledged: true
  side_effects_unchanged: true
