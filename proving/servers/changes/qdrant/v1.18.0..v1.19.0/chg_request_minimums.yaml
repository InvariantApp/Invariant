# Written by hand, as Qdrant's maintainers would: 1.19 documents a minimum of
# 1 for search limits, hnsw_ef and min_count, which 1.18 allowed from 0. No op
# can make the server take a value it refuses, so an old caller sending 0 is
# acknowledged, not served.
irVersion: 1
id: chg_request_minimums
summary: "Limits, hnsw_ef and min_count must now be at least 1."
scopes: []
