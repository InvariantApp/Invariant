# InvenTree as inventree-python's own test compose file runs it: SQLite in a
# volume, the database migrated and the suite's fixtures loaded by a one-off
# container before the server starts, and the administrator the suite signs
# in as made by the server on its way up, after the fixtures, which replace
# the first users. No background worker, so build tasks finish before they
# answer, as in the client's CI. The volume is thrown away after each arm.
x-inventree: &inventree
  image: ${IMAGE}
  volumes:
    - data:/home/inventree/data
  environment:
    INVENTREE_DEBUG: "True"
    INVENTREE_SITE_URL: http://127.0.0.1:16333
    INVENTREE_DB_ENGINE: sqlite
    INVENTREE_DB_NAME: /home/inventree/data/test_db.sqlite3
    INVENTREE_DEBUG_LEVEL: warning
    INVENTREE_ADMIN_USER: testuser
    INVENTREE_ADMIN_PASSWORD: ${INVENTREE_PASSWORD}
    INVENTREE_ADMIN_EMAIL: test@test.com
    INVENTREE_COOKIE_SAMESITE: "False"
    INVENTREE_GUNICORN_WORKERS: "2"

services:
  prepare:
    <<: *inventree
    command: ["bash", "-c", "invoke migrate && invoke dev.import-fixtures"]
    restart: "no"

  inventree:
    <<: *inventree
    container_name: ${CONTAINER}
    depends_on:
      prepare:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PORT}:8000"

volumes:
  data:
