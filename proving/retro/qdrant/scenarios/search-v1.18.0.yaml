# What an old caller does with search: make a collection, fill it and search
# it, with and without a filter, in 1.18's own shapes. It starts by removing
# the collection, because the old version is a deployment that keeps what the
# last run left in it.
name: search on 1.18
contract: v1.18.0
steps:
  - id: clear
    request:
      method: DELETE
      path: /collections/retro
  - id: create
    request:
      method: PUT
      path: /collections/retro
      body:
        vectors: { size: 4, distance: Dot }
  - id: fill
    request:
      method: PUT
      path: /collections/retro/points?wait=true
      body:
        points:
          - { id: 1, vector: [0.05, 0.61, 0.76, 0.74], payload: { city: Berlin } }
          - { id: 2, vector: [0.19, 0.81, 0.75, 0.11], payload: { city: London } }
          - { id: 3, vector: [0.36, 0.55, 0.47, 0.94], payload: { city: Moscow } }
          - { id: 4, vector: [0.18, 0.01, 0.85, 0.80], payload: { city: New York } }
  - id: search
    request:
      method: POST
      path: /collections/retro/points/search
      body:
        vector: [0.2, 0.1, 0.9, 0.7]
        limit: 3
        with_payload: true
  - id: search_filtered
    request:
      method: POST
      path: /collections/retro/points/search
      body:
        vector: [0.2, 0.1, 0.9, 0.7]
        limit: 3
        filter:
          must:
            - key: city
              match: { value: London }
        with_payload: true
  - id: drop
    request:
      method: DELETE
      path: /collections/retro
