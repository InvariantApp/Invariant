name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Dormant until the npm organisation exists and trusted publishing is
    # configured for each package. Set the repository variable PUBLISH_ENABLED
    # to "true" to switch it on.
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing: a short-lived token from GitHub's OIDC issuer
      # instead of a long-lived secret, and provenance recorded automatically.
      # The same identity signs the action's attestations.
      id-token: write
      attestations: write
    outputs:
      published: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Every platform's binary, verified, so each platform package is packed
      # with the file it exists to carry.
      - run: node --import tsx scripts/fetch-oasdiff.mts

      # The same checks the published artifacts are held to on every push.
      - run: pnpm build
      - run: pnpm check:packages --all-binaries

      # Opens a version pull request while changesets are pending, and
      # publishes once that pull request is merged.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          version: pnpm version-packages
          publish: pnpm changeset publish
          commit: "Version packages"
          title: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Every npm package carries its CycloneDX bill of materials inside the
      # tarball its provenance covers (scripts/prepack.mjs). The action is
      # released as the bundle the v0 tag points at, not through npm, so its
      # bill of materials and provenance are attested here, on the bundle.
      - name: The action's bill of materials
        if: steps.changesets.outputs.published == 'true'
        run: pnpm --filter @invariant-app/action sbom --sbom-format cyclonedx --prod --out action.cdx.json

      - name: Attest the action's bill of materials
        if: steps.changesets.outputs.published == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packages/action/bundle/main.js
          sbom-path: action.cdx.json

      - name: Attest the action's build provenance
        if: steps.changesets.outputs.published == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packages/action/bundle/main.js

      # The workflow `invariant init` writes uses InvariantApp/Invariant@v0,
      # so every provider's check runs the action from the latest release.
      - name: Move the v0 tag to this release
        if: steps.changesets.outputs.published == 'true'
        run: |
          git tag -f v0
          git push -f origin v0

  # The proxy image of every sidecar version published, with the same version,
  # its bill of materials and provenance attested and the image signed.
  image:
    needs: release
    if: contains(needs.release.outputs.published, '"@invariant-app/sidecar"')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
