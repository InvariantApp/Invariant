name: Proving ground

# The heavy measurements: every rig in proving/, on GitHub's machines rather
# than a laptop. Nightly, and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: proving
  cancel-in-progress: false

jobs:
  corpus:
    name: corpus (shard ${{ matrix.shard }} of 8)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node --import tsx scripts/fetch-oasdiff.mts --host

      # Downloaded once per week of manifest changes, verified against the
      # manifest's hashes on every use.
      - uses: actions/cache@v4
        with:
          path: .cache/corpus
          key: corpus-${{ hashFiles('proving/corpus/manifest.json') }}

      - name: Run this shard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REAL_CONCURRENCY: "2"
        run: >-
          node --import tsx proving/corpus/run.mts
          --shard ${{ matrix.shard }}/8
          --results corpus-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.shard }}
          path: corpus-${{ matrix.shard }}.json

  traffic:
    name: traffic (rig C)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .cache/corpus
          key: corpus-${{ hashFiles('proving/corpus/manifest.json') }}

      # Every pair the recorded corpus run found closing, 100 generated
      # requests per adapted site, three arms each. Fails on any violation.
      - name: Generated traffic through the adapter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm proving:traffic

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traffic-report
          path: |
            proving/traffic/REPORT.md
            proving/traffic/results.json

  swagger:
    name: swagger 2.0 (two converters)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node --import tsx scripts/fetch-oasdiff.mts --host

      - uses: actions/cache@v4
        with:
          path: .cache/corpus
          key: corpus-${{ hashFiles('proving/corpus/manifest.json') }}

      # Every Swagger 2.0 document in the corpus, Kubernetes included, which
      # is too large to diff on a small machine. Fails on any difference
      # between the two conversions that nobody has settled.
      - name: Both conversions, compared by the differ
        run: node --import tsx proving/swagger/oracle.mts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swagger-report
          path: proving/swagger/REPORT.md

  servers:
    name: servers (rig D, ${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [qdrant]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Runs the projects' own images and test suites, which this project did
    # not write, so the job holds no secret. Reading this repository needs
    # the token while it is private; checkout drops it from git's config
    # before anything else runs, so no later step can use it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v6

      - name: Three arms per release pair
        run: pnpm proving:servers --project ${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: servers-${{ matrix.project }}
          path: .cache/servers/results-${{ matrix.project }}.json
          # Under .cache, which upload-artifact skips unless told otherwise.
          include-hidden-files: true

  fuzz:
    name: fuzz (rig F)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every commit runs these with a few hundred cases; the nightly run
      # takes a fresh seed and many more. A failure prints its seed and path,
      # which replay it exactly with FUZZ_SEED.
      - name: Hostile input, deeply
        env:
          FUZZ_RUNS: "200000"
          FUZZ_SEED: ${{ github.run_number }}
        run: pnpm exec vitest run proving/fuzz --testTimeout=3000000

      # L1: Changes generated from the IR schema, with a new seed each night.
      - name: Every Change is served or blocked, deeply
        env:
          FUZZ_RUNS: "50000"
          FUZZ_SEED: ${{ github.run_number }}
        run: pnpm exec vitest run packages/compiler/src/servable.test.ts --testTimeout=3000000

  replay-mine:
    name: replay miner (rig E)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Reads pull request metadata through the API and commits only the index.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Find where humans migrated code across an SDK's major release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --import tsx proving/replay/mine.mts --months 36 --limit 150 --minutes 40

      - name: Record the index
        if: github.event_name == 'schedule'
        run: |
          git config user.name "invariant-proving"
          git config user.email "proving@users.noreply.github.com"
          git add proving/replay/index.json
          git diff --cached --quiet || git commit -m "Record newly mined replay cases"
          git pull --rebase
          git push

  report:
    needs: [corpus, traffic, swagger, servers, fuzz]
    # Every rig's result is gathered even when one of them failed, so the
    # scoreboard says which; nothing is recorded unless all of them passed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: corpus-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: traffic-report
          path: proving/traffic

      - uses: actions/download-artifact@v4
        with:
          name: swagger-report
          path: proving/swagger

      - uses: actions/download-artifact@v4
        with:
          pattern: servers-*
          path: servers-results
          merge-multiple: true

      - name: Merge the corpus shards into one report
        id: corpus
        run: node --import tsx proving/corpus/run.mts --report corpus-*.json

      - name: Merge the real-server projects into one report
        if: always()
        run: node --import tsx proving/servers/run.mts --report servers-results/*.json

      - name: The scoreboard
        if: always()
        env:
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: node --import tsx proving/scoreboard.mts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proving-report
          path: |
            proving/SCOREBOARD.md
            proving/corpus/REPORT.md
            proving/corpus/results.json
            proving/servers/REPORT.md
            proving/servers/results.json
            proving/swagger/REPORT.md

      # Recorded in the repository, so a number quoted anywhere can be traced
      # to the run that produced it. Nothing is committed when nothing changed.
      - name: Record the reports
        if: github.event_name == 'schedule' && success()
        run: |
          git config user.name "invariant-proving"
          git config user.email "proving@users.noreply.github.com"
          git add proving/SCOREBOARD.md proving/corpus proving/traffic proving/servers proving/swagger
          git diff --cached --quiet || git commit -m "Record the nightly proving run"
          git pull --rebase
          git push
