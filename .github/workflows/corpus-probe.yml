name: Corpus probe

# One provider's corpus pairs, on demand, for looking into a pair the nightly
# run flagged without running the machine-sized ones on a laptop. It records
# nothing: the result is an artifact to read, never a new baseline.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider as the manifest names it, such as stripe.com
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    name: corpus probe (${{ inputs.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node --import tsx scripts/fetch-oasdiff.mts --host

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/corpus
          key: corpus-${{ hashFiles('proving/corpus/manifest.json') }}

      - name: Run the provider's pairs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVIDER: ${{ inputs.provider }}
          REAL_CONCURRENCY: "1"
        run: >-
          node --import tsx proving/corpus/run.mts
          --provider "$PROVIDER"
          --results probe.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe
          path: probe.json
