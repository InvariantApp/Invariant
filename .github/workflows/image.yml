name: Proxy image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    # Dormant until publishing is switched on, like the npm release.
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Keyless signing: the signature is bound to this workflow's identity
      # rather than to a key that could leak.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Proved before it is pushed: the same smoke test CI runs on every commit.
      - run: pnpm bundle:sidecar
      - run: node --import tsx scripts/image.mts

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sidecar
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: packages/sidecar/image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do
            cosign sign --yes "${tag}@${{ steps.build.outputs.digest }}"
          done
