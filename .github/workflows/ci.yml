name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The release binary a provider actually gets, verified against upstream's
      # checksums and the hash committed in packages/diff/src/binaries.ts. CI
      # runs the gate on exactly what ships, rather than on a local build of
      # the same tag, and needs no Go toolchain to do it.
      - name: Fetch the pinned oasdiff release
        run: node --import tsx scripts/fetch-oasdiff.mts --host

      - name: Check the gate finds the shipped oasdiff
        run: node --import tsx -e 'import("@invariant/diff").then(async (m) => { await m.assertUsableOasdiff(); console.log(m.oasdiffBinary()); })'

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # What a provider would actually install: every published package built,
      # packed as a publish would pack it, and checked for undeclared imports,
      # broken manifests and types a TypeScript consumer cannot resolve.
      - name: Build the published packages
        run: pnpm build

      - name: Check the published packages
        run: pnpm check:packages

      # The layers that need the provider's code running. They start real
      # processes, so they are not part of `pnpm test`, and leaving them out of
      # CI would mean the only checks that can catch a swapped value map or a
      # drifted specification never run anywhere but a laptop.
      - name: Release gate, including the differential and conformance checks
        working-directory: fixtures/provider-acme
        # Bounded on purpose. This step starts real processes and waits on
        # them, so a build that never becomes ready would otherwise sit here
        # until the whole job times out and say nothing about why.
        timeout-minutes: 6
        run: pnpm exec invariant check --full
