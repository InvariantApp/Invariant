name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The release binary a provider actually gets, verified against upstream's
      # checksums and the hash committed in packages/diff/src/binaries.ts. CI
      # runs the gate on exactly what ships, rather than on a local build of
      # the same tag, and needs no Go toolchain to do it.
      - name: Fetch the pinned oasdiff release
        run: node --import tsx scripts/fetch-oasdiff.mts --host

      - name: Check the gate finds the shipped oasdiff
        run: node --import tsx -e 'import("@invariant/diff").then(async (m) => { await m.assertUsableOasdiff(); console.log(m.oasdiffBinary()); })'

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # What a provider would actually install: every published package built,
      # packed as a publish would pack it, and checked for undeclared imports,
      # broken manifests and types a TypeScript consumer cannot resolve.
      - name: Build the published packages
        run: pnpm build

      - name: Check the published packages
        run: pnpm check:packages

      # The action runs from this repository at a tag, so the committed bundle
      # is what providers execute. It has to be exactly what the source builds.
      - name: Check the action bundle is current
        run: |
          pnpm --filter @invariant/action bundle
          git diff --exit-code -- packages/action/bundle

      # The proxy image, built and run the way a provider should run it, in
      # front of the fixture provider's current build.
      - name: Build and prove the proxy image
        run: |
          pnpm bundle:sidecar
          node --import tsx scripts/image.mts

      # The real action.yml, on a real runner, against the fixture provider.
      - name: Run the action on this repository
        uses: ./
        with:
          config: fixtures/provider-acme/invariant.yaml
          comment: "false"

      # The layers that need the provider's code running. They start real
      # processes, so they are not part of `pnpm test`, and leaving them out of
      # CI would mean the only checks that can catch a swapped value map or a
      # drifted specification never run anywhere but a laptop.
      - name: Release gate, including the differential and conformance checks
        working-directory: fixtures/provider-acme
        # Bounded on purpose. This step starts real processes and waits on
        # them, so a build that never becomes ready would otherwise sit here
        # until the whole job times out and say nothing about why.
        timeout-minutes: 6
        run: pnpm exec invariant check --full

  # What a stranger gets, on each operating system a provider's CI runs:
  # every package published to a private registry, installed into an empty
  # project with Go off the PATH, then `init` and a check that has to block a
  # breaking change.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch the pinned oasdiff release for this runner
        run: node --import tsx scripts/fetch-oasdiff.mts --host

      - run: pnpm build

      - name: Install from a registry and use it from nothing
        run: node --import tsx scripts/install-test.mts
