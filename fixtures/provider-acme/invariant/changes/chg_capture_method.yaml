irVersion: 1
id: chg_capture_method
summary: >-
  `capture_method` became an explicit field. Every payment made before it
  existed was captured automatically, so that is the exact default.
scopes:
  - schema: "#/components/schemas/PaymentCreateParams"
  - schema: "#/components/schemas/Payment"
ops:
  - op: add
    path: /capture_method
    value: automatic
assertions:
  same_concept: true
  side_effects_unchanged: true
  # A caller who predates this field never sent one, so every one of their
  # requests is served with the default below. That the default matches what
  # the API used to do is a claim about behaviour, not something either
  # specification states, so it is acknowledged here by a person.
  loss_acknowledged: true
