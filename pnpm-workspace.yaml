packages:
  - packages/*
  - apps/*
  - fixtures/*

allowBuilds:
  '@nestjs/core': false
  esbuild: true
  # Only its prebuilt grammar .wasm is read, by web-tree-sitter; the native
  # binding its install script builds is never loaded.
  tree-sitter-python: false

minimumReleaseAgeExclude:
  - '@nestjs/common@12.0.4'
  - '@nestjs/core@12.0.4'
  - '@nestjs/platform-express@12.0.4'

# openapi-typescript 7.13 (latest) declares TypeScript ^5 only. Consumer B's
# generated types are compiled and tested under this repository's TypeScript 6
# on every run, so the combination is known to work rather than assumed to.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"
