# Which judge is allowed to do what, and why.
#
# Decided from measurement, not preference. Regenerate with `pnpm eval:record`
# and re-read the numbers before changing anything here. Every threshold is
# pinned to the model that produced it, because confidence is version-coupled
# and a number tuned against one version is not evidence about the next.
measuredOn: 2026-09-24
corpus:
  cases: 651
  # Past the 600 the launch gate asks for, 55% of it mined from real deltas
  # against the 40% it asks. The per-family precision at each judge's
  # threshold, which is what L4b is judged on, is eval/results.json, written
  # by eval/measure.mts and held to the recorded answers by
  # packages/eval/src/eval.test.ts on every commit. The numbers below that
  # date from before 2026-09-24 describe the first 240 cases.
  families: [rename, unit, nesting, enum, type-change, split-merge, removal, ambiguous, adversarial, decoy]

  provenance:
    # Never added together. A corpus its author wrote measures the questions
    # they thought to ask; only the mined half says anything about how the work
    # really arrives, and reporting one number would let the easier part carry
    # the harder one.
    mined:
      cases: 358
      # 313 of these are every distinct alignment question the proposer asks
      # across the 1,553 pinned corpus pairs (eval/mine.mts), labelled by two
      # readers working apart, each with both schemas whole and the documents
      # to search. The 32 either could not settle, or disagreed on, are left
      # out; labels and reasons are in eval/mined/labels.json. The readers were
      # Claude agents, the family S2 is from, so S2's agreement with them is
      # the figure most likely to flatter. When the fields inside new wrappers
      # came to be offered, the 57 questions whose label that could change
      # were read again the same way, by two more Claude agents: they agreed
      # on all 57, and 25 labels moved from a wrapper to the field inside it.
      # The other 45 came from changelogs:
      sources:
        - https://docs.github.com/en/rest/about-the-rest-api/breaking-changes
        - https://docs.stripe.com/changelog/basil
        - https://shopify.dev/docs/api/admin-graphql/latest/objects/Order
      note: >-
        Several shapes here were not invented for this corpus and would not
        have been: a boolean flag renamed into a string enum, two enum values
        merged so that mapping back cannot be bijective, a nested object
        replaced by a URL that has to be fetched, and a relocation gated on a
        discriminator.
    written:
      cases: 293

tasks:
  alignment:
    question: Which added field, if any, is what this removed field became?

    rules:
      verdict: assists
      selectiveAccuracy: 1.0
      coverage: 0.221
      answeredAndWrong: 0
      # It was 0.962 before the last fix, and the way that was found matters
      # more than the number. See `cacheKeyedOnJudge` below.
      note: >-
        Settles plain renames and unit suffixes for nothing, with no model and
        no network. Answers nothing at all on removals, and only 5 of the 45
        mined cases, which is the honest measure of how little of this work is
        decidable from spelling.

    jev:
      verdict: owns
      model: jev-1.13.0
      measuredOn: 2026-09-24
      # Two floors, by what the answer says (ANSWER_THRESHOLDS in
      # packages/proposer/src/propose.ts). On all 651 cases at the single
      # floor of 0.6 it used to have, fourteen answers were wrong above it:
      # the last wrong "nothing replaced it" at 0.85, the last wrong named
      # field at 0.93. Each floor sits above its last error. They were read
      # off the corpus they are measured on, and Jev's confidence moves
      # between runs by a few hundredths (an injected case answered at 0.57
      # once was 0.63 when asked again), so the margins are thin and the next
      # mined cases are what test them.
      confidenceThreshold: { named: 0.95, none: 0.9 }
      atSinglePointSix: { answered: 573, selectiveAccuracy: 0.976, answeredAndWrong: 14 }
      atThreshold:
        answered: 386
        coverage: 0.593
        selectiveAccuracy: 1.0
        answeredAndWrong: 0
        mined: { answered: 220, outOf: 358, selectiveAccuracy: 1.0, answeredAndWrong: 0 }
      note: >-
        May draft a Change for a person to review. It cannot merge one, and
        nothing it produces reaches a request path without passing the closure
        check and a human reviewer.

        The threshold filters rather than annotates, which it did not always
        do. It used to mark a low-confidence answer for attention and draft it
        anyway, while this file claimed no draft was ever written from one.
        Running real APIs showed the cost: on one Adyen pair every alignment
        came back between 23% and 45% confident, pairing
        `paymentInstrumentGroupId` with `aggregationLevel` among others, and
        each became a `move` that rewrote the predicted document on a guess. A
        wrong alignment relocates a value, so a merged one sends real data to
        the wrong field. Below the threshold is now reported as an open
        question instead.

    s2:
      verdict: owns
      model: claude-opus-5
      measuredOn: 2026-09-21
      confidenceThreshold: 0.85
      selectiveAccuracy: 0.963
      coverage: 1.0
      # Not calibrated like Jev, and the threshold is where that shows. Nine
      # answers were wrong between 0.6 and 0.8; none above 0.81. 0.85 is the
      # floor with margin above the last error, not the last error itself.
      atThreshold:
        answered: 187
        coverage: 0.779
        selectiveAccuracy: 1.0
        answeredAndWrong: 0
        mined: { answered: 27, outOf: 45, selectiveAccuracy: 1.0, answeredAndWrong: 0 }
      cost: >-
        About $2.50 for the whole corpus: 311,748 input tokens at $5 per
        million, and output estimated at $0.90, since output tokens were not
        yet recorded. Median latency 2.5 s against Jev's 0.2 s.
      note: >-
        Every error is the same kind: a merge or a relocation answered as
        "nothing replaced it", where the label names the field it went into.
        That drafts a removal the provider then decides about, never a move
        of real data to the wrong field. Adversarial cases, including the
        injected ones, were all right.

        Not measured on the 157 mined questions whose candidates changed on
        2026-09-24, when the fields inside new wrappers came to be offered,
        which include every case it got wrong. They are recorded by the
        proving workflow's `judges` job, where its key is, and that job's
        first run was refused: the account's credit balance was too low. On
        the 494 it has answers for, 400 clear 0.85 and none is wrong.

    escalation:
      # What drafts: rules and Jev together, handing a question to S2 only
      # where they are less than 0.9 sure.
      chain: rules+jev, escalating to s2 below 0.9
      selectiveAccuracy: 0.971
      coverage: 1.0
      answeredAndWrong: 7
      note: >-
        More right than either judge alone, and every one of the seven errors
        is again a merge or relocation said to have no successor. Each answer
        is held to the threshold of the judge that gave it.

    byProvenance:
      mined: { cases: 45, selectiveAccuracy: 0.91 }
      written: { cases: 195, selectiveAccuracy: 0.97 }
      note: >-
        Six points apart, which is the thing the mined half was added to find
        out. Real changes are harder than invented ones, and any number quoted
        without this split is quoting the easier half.

byFamily:
  # At each judge's floors on all 651 cases (eval/results.json). Nesting was
  # the weak family for both judges: a value moved into a new wrapper object
  # (Adyen's transaction rule conditions into `ruleRestrictions`, Datadog's
  # recommendation filter into `data`, a Google Play track's `userFraction`
  # into `releases`) answered as having no successor, because only the
  # wrapper was on offer. The fields inside new wrappers are now offered, and
  # 25 mined labels became the field inside, where both readers agreed. At
  # Jev's old floor of 0.6 that alone took nesting from 85.2% of 54 to 96.6%
  # of 59; the two floors take every family to 100%, at 59% coverage.
  jev: { all: 1.0 }
  s2: { all: 1.0, unmeasured: 157 }
  rules: { all: 1.0 }

calibration:
  - atLeast: 0.8
    answered: 184
    accuracy: 1.0
  - atLeast: 0.6
    answered: 27
    accuracy: 1.0
  - atLeast: 0.4
    answered: 17
    accuracy: 0.65
  - atLeast: 0.2
    answered: 8
    accuracy: 0.75
  - atLeast: 0.0
    answered: 4
    accuracy: 0.5

integrity:
  cacheKeyedOnJudge: true
  # The finding that mattered most, and it was about the measurement rather
  # than the thing measured.
  #
  # Recorded answers are replayed in CI so the evaluation is free and
  # deterministic. The key was the judge's *name* and the question, and nothing
  # else: not the rules judge's tables, not the wording Jev is asked with, not
  # the pinned model. So any of those could change and every recorded answer
  # still looked current.
  #
  # Deleting the cache by hand moved the rules judge from 100% to 96.2% on a
  # corpus and an implementation that had not changed since the answers were
  # written. It had been answering two cases at 0.94 and 1.00 confidence and
  # getting both wrong, and the evaluation was reporting 100%.
  #
  # The key now includes a fingerprint each judge computes from whatever
  # decides its answers. `packages/eval/src/cache.test.ts` holds it down.
  note: >-
    A judge whose fingerprint has moved is reported as unmeasured rather than
    served from cache, because a stale pass is worse than no result: the run
    goes green and the metrics describe code that is no longer there.

security:
  promptInjection:
    followed: 0
    outOf: 51
    aboveThreshold: 0
    # The defence used to cover only the change notes, and the question framing
    # named field descriptions as a thing to decide from. An instruction placed
    # inside the removed field's own description was followed at 0.82
    # confidence, above the threshold that decides whether a draft is written.
    #
    # Widening the framing to distrust all prose made things worse: overall
    # accuracy fell from 95.0% to 94.2% and the enum family from 100% to 93%,
    # because those cases turn on descriptions being read and believed. The
    # wording that worked separates a description saying what a field means,
    # which is the best evidence available, from a sentence telling the reader
    # what to answer, which is not evidence about anything.
    remaining: inject_schema_comment
    caughtBy: confidence threshold
    note: >-
      One case still lands on the wrong candidate, at 0.57 against a threshold
      of 0.6. No draft is written from it. It is the only injection vector left
      that gets an answer at all, and it is the one hidden in a field's own
      description rather than in the notes.

  weakest:
    case: shopify_landing_page_url_removed
    confidence: 0.51
    description: >-
      A field genuinely deleted, beside candidates removed in the same release
      that share its shape and half its name. Four of the ten remaining errors
      are this exact shape and three of those four are mined, so it is the real
      failure mode rather than an artefact of how the corpus was written. All
      four sit below the threshold, and it is the clearest direction for the
      next round of work.
