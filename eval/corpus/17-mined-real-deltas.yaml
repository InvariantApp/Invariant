    description: The response object as a result of <code>BatchWriteItem</code> call. This is essentially a map of table name to <code>ConsumedCapacityUnits</code>.
  candidates:
    - name: ItemCollectionMetrics
      type: object
      description: <p>A list of tables that were processed by <code>BatchWriteItem</code> and, for each table, information about any item collections that were affected by individual <code>DeleteItem</code> or <code>PutItem</code> operations.</p> <p>Each entry consists of the following subelements:</p> <ul> <li> <p> <code>ItemCollectionKey</code> - The partition key value of the item collection. This is the same as the partition key value of the item.</p> </li> <li> <p> <code>SizeEstimateRangeGB</code> - An estimate of item collection size, expressed in GB. This is a two-element array containing a lower bound and an upper bound for the estimate. The estimate includes the size of all the items in the table, plus the size of all attributes projected into all of the local secondary indexes on the table. Use this estimate to measure whether a local secondary index is approaching its size limit.</p> <p>The estimate is subject to change over time; therefore, do not rely on the precision or accuracy of the estimate.</p> </li> </ul>
    - name: ConsumedCapacity
      type: array
      description: <p>The capacity units consumed by the entire <code>BatchWriteItem</code> operation.</p> <p>Each element consists of:</p> <ul> <li> <p> <code>TableName</code> - The table that consumed the provisioned throughput.</p> </li> <li> <p> <code>CapacityUnits</code> - The total number of capacity units consumed.</p> </li> </ul>
    - name: ConsumedCapacity.*.TableName
      type: string
      description: The name of the table that was affected by the operation.
    - name: ConsumedCapacity.*.CapacityUnits
      type: number
      format: double
      description: The total number of capacity units consumed by the operation.
    - name: ConsumedCapacity.*.ReadCapacityUnits
      type: number
      format: double
      description: The total number of read capacity units consumed by the operation.
    - name: ConsumedCapacity.*.WriteCapacityUnits
      type: number
      format: double
      description: The total number of write capacity units consumed by the operation.
    - name: ConsumedCapacity.*.Table
      type: object
      description: Represents the amount of provisioned throughput capacity consumed on a table or an index.
    - name: ConsumedCapacity.*.Table.ReadCapacityUnits
      type: number
      format: double
      description: The total number of read capacity units consumed on a table or an index.
    - name: ConsumedCapacity.*.Table.WriteCapacityUnits
      type: number
      format: double
      description: The total number of write capacity units consumed on a table or an index.
    - name: ConsumedCapacity.*.Table.CapacityUnits
      type: number
      format: double
      description: The total number of capacity units consumed on a table or an index.
    - name: ConsumedCapacity.*.LocalSecondaryIndexes
      type: object
      description: The amount of throughput consumed on each local index affected by the operation.
    - name: ConsumedCapacity.*.GlobalSecondaryIndexes
