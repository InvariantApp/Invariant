      type: object
    - name: affirm.pricePlan
      type: string
      description: Selected Affirm financing package. Choose from **core**, **standard**, or **signature**. Defaults to **core** if no selection made.
    - name: carnet.transactionDescription
      type: object
    - name: carnet.transactionDescription.doingBusinessAsName
      type: string
      description: |-
        The text to be shown on the shopper's bank statement.
         We recommend sending a maximum of 22 characters, otherwise banks might truncate the string.
         Allowed characters: **a-z**, **A-Z**, **0-9**, spaces, and special characters **. , ' _ - ? + * /**.
