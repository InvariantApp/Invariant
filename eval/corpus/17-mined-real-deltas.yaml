        The purchase token of the originating purchase if this subscription is one of the following:  
        - Re-signup of a canceled but non-lapsed subscription 
        - Upgrade/downgrade from a previous subscription  For example, suppose a user originally signs up and you receive purchase token X, then the user cancels and goes through the resignup flow (before their subscription lapses) and you receive purchase token Y, and finally the user upgrades their subscription and you receive purchase token Z. If you call this API with purchase token Z, this field will be set to Y. If you call this API with purchase token Y, this field will be set to X. If you call this API with purchase token X, this field will not be set.
    - name: orderId
      type: string
      description: The order id of the latest recurring order associated with the purchase of the subscription.
    - name: paymentState
      type: integer
      format: int32
      description: |-
        The payment state of the subscription. Possible values are:  
        - Payment pending 
        - Payment received 
        - Free trial 
        - Pending deferred upgrade/downgrade
    - name: priceAmountMicros
      type: string
      format: int64
      description: Price of the subscription, not including tax. Price is expressed in micro-units, where 1,000,000 micro-units represents one unit of the currency. For example, if the subscription price is €1.99, price_amount_micros is 1990000.
    - name: priceChange
      type: object
      description: Contains the price change information for a subscription that can be used to control the user journey for the price change in the app. This can be in the form of seeking confirmation from the user or tailoring the experience for a successful conversion.
    - name: priceCurrencyCode
      type: string
      description: ISO 4217 currency code for the subscription price. For example, if the price is specified in British pounds sterling, price_currency_code is "GBP".
    - name: profileId
      type: string
      description: The Google profile id of the user when the subscription was purchased. Only present for purchases made with 'Subscribe with Google'.
    - name: profileName
      type: string
      description: The profile name of the user when the subscription was purchased. Only present for purchases made with 'Subscribe with Google'.
    - name: purchaseType
      type: integer
      format: int32
      description: |-
        The type of purchase of the subscription. This field is only set if this purchase was not made using the standard in-app billing flow. Possible values are:  
        - Test (i.e. purchased from a license testing account) 
        - Promo (i.e. purchased using a promo code)
    - name: startTimeMillis
      type: string
      format: int64
      description: Time at which the subscription was granted, in milliseconds since the Epoch.
    - name: userCancellationTimeMillis
      type: string
      format: int64
      description: The time at which the subscription was canceled by the user, in milliseconds since the epoch. Only present if cancelReason is 0.
    - name: cancelSurveyResult.cancelSurveyReason
      type: integer
      format: int32
      description: |-
        The cancellation reason the user chose in the survey. Possible values are:  
        - Other 
        - I don't use this service enough 
        - Technical issues 
        - Cost-related reasons 
        - I found a better app
    - name: cancelSurveyResult.userInputCancelReason
      type: string
      description: The customized input cancel reason from the user. Only present when cancelReason is 0.
    - name: priceChange.newPrice
      type: object
    - name: priceChange.newPrice.currency
      type: string
      description: 3 letter Currency code, as defined by ISO 4217.
    - name: priceChange.newPrice.priceMicros
      type: string
      description: The price in millionths of the currency base unit represented as a string.
    - name: priceChange.state
      type: integer
      format: int32
      description: |-
        The current state of the price change. Possible values are:  
        - Outstanding: State for a pending price change waiting for the user to agree. In this state, you can optionally seek confirmation from the user using the In-App API. 
        - Accepted: State for an accepted price change that the subscription will renew with unless it's canceled. The price change takes effect on a future date when the subscription renews. Note that the change might not occur when the subscription is renewed next.
  successor: startTimeMillis
  rationale: googleapis.com:androidpublisher v1.1 to v2. Identical description (time the subscription was granted, ms since Epoch) and int64 string type; validUntil similarly became expiryTimeMillis.
